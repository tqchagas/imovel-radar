# Production overlay for the oracle-new VPS, where a shared nginx (owned by the
# caixa-auction stack) terminates TLS for every app on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# See docs/deploy-oracle-new.md for the full runbook.

services:
  postgres:
    # Sized for a ~300MB dataset on a host shared with other stacks.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_connections=20
    environment:
      TZ: America/Sao_Paulo
    shm_size: "128mb"
    deploy:
      resources:
        limits:
          memory: 640M

  web:
    container_name: imovel-radar-web
    # No published port: the shared nginx reaches this container over the `edge`
    # network by name. `!reset` clears the base file's ports instead of appending
    # to it, which would re-publish 8000 and collide with the caixa-auction crawler.
    ports: !reset []
    expose:
      - "8000"
    environment:
      TZ: America/Sao_Paulo
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default
      - edge

networks:
  # Created once by hand on the host: `docker network create edge`.
  # Shared with the caixa-auction nginx; Postgres deliberately stays off it.
  edge:
    external: true
