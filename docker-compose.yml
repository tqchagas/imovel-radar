services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: imovelradar
      POSTGRES_PASSWORD: imovelradar
      POSTGRES_DB: imovelradar
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imovelradar -d imovelradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://imovelradar:imovelradar@postgres:5432/imovelradar
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
